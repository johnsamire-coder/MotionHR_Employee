name: motionhr_employee
description: MotionHR Employee & Manager App
publish_to: 'none'
version: 1.4.0+7

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.2
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.5
  file_picker: ^8.1.2
  flutter_background_service: ^5.0.10
  flutter_background_service_android: ^6.2.7
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^17.2.4
  image_picker: ^1.2.3
  open_file: ^4.0.0
  path_provider: ^2.1.6
  pdf: ^3.10.7
  share_plus: ^10.1.4
  printing: ^5.11.1
  local_auth: ^3.0.2
  excel: ^4.0.6
  http_parser: ^4.1.2
  sqflite: ^2.4.3
  path: ^1.9.1
  fl_chart: ^1.2.0
  flutter_udid: ^4.1.6


dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - lib/l10n/
    - assets/fonts/
    - assets/branding/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

# ═══════════════════════════════════════════
# App Launcher Icons Configuration
# ═══════════════════════════════════════════
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/branding/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#4A148C"
  adaptive_icon_foreground: "assets/branding/app_icon.png"
  remove_alpha_ios: true
  web:
    generate: false

# ═══════════════════════════════════════════
# Native Splash Screen Configuration
# ═══════════════════════════════════════════
flutter_native_splash:
  color: "#4A148C"
  image: "assets/branding/icon_white.png"
  color_dark: "#1a0033"
  image_dark: "assets/branding/icon_white.png"
  android_12:
    image: "assets/branding/icon_white.png"
    color: "#4A148C"
    image_dark: "assets/branding/icon_white.png"
    color_dark: "#1a0033"
  android: true
  ios: true
  web: false
  fullscreen: true
  android_gravity: center
  ios_content_mode: center
